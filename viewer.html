<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Markdown Reader</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="viewer.html" title="打开一个新的 Markdown 地址">
      <img src="assets/icon.svg" width="26" height="26" alt="">
      <span class="brand-name">Markdown</span>
    </a>

    <div class="doc-meta" id="doc-meta" hidden>
      <span class="doc-title" id="doc-title"></span>
      <span class="doc-sub" id="doc-sub"></span>
    </div>

    <div class="spacer"></div>

    <button class="icon-btn" id="raw-btn" type="button" title="查看原文" aria-label="查看原文" hidden>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
    </button>

    <button class="icon-btn" id="reload-btn" type="button" title="重新加载" aria-label="重新加载" hidden>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
    </button>

    <button class="icon-btn theme-toggle" id="theme-toggle" type="button" title="切换到深色模式" aria-label="切换到深色模式">
      <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <aside class="toc" id="toc" aria-label="目录" hidden>
    <div class="toc-head">
      <span class="toc-title">目录</span>
      <button class="toc-collapse" id="toc-collapse" type="button" title="收起目录" aria-label="收起目录">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
    <nav class="toc-list" id="toc-list"></nav>
  </aside>

  <div class="toc-backdrop" id="toc-backdrop" hidden></div>

  <button class="toc-fab" id="toc-fab" type="button" title="展开目录" aria-label="展开目录" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
    <span>目录</span>
  </button>

  <main class="page">
    <section class="landing" id="landing" hidden>
      <div class="landing-glow" aria-hidden="true"></div>
      <img class="landing-icon" src="assets/icon.svg" width="72" height="72" alt="">
      <h1>Markdown Reader</h1>
      <p class="landing-lead">在浏览器地址栏输入 <code>.md</code> 地址就会自动渲染；支持 <code>https://…/README.md</code> 和本地路径 <code>/home/you/docs/README.md</code>。</p>

      <form class="open-form" id="open-form" novalidate>
        <input id="url-input" type="text" inputmode="url" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="https://example.com/README.md 或 /home/you/docs/README.md" aria-label="Markdown 地址">
        <button class="primary" type="submit">打开</button>
      </form>

      <p class="landing-error" id="landing-error" hidden></p>

      <ul class="feature-list">
        <li>Mermaid 图表</li>
        <li>代码高亮</li>
        <li>表格与任务列表</li>
        <li>明暗主题</li>
      </ul>

      <p class="landing-note">只读预览，不会修改原文件。本地文件需要在扩展详情中开启「允许访问文件网址」。查看原始内容时，在地址后加上 <code>#ry-raw</code>。</p>
    </section>

    <section class="status" id="status" hidden>
      <div class="spinner" id="status-spinner" aria-hidden="true"></div>
      <div class="status-icon" id="status-icon" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
      </div>
      <h2 id="status-title">正在读取 Markdown…</h2>
      <p id="status-text"></p>
      <div class="status-actions" id="status-actions" hidden>
        <button class="ghost" id="retry-btn" type="button">重试</button>
        <button class="ghost" id="change-btn" type="button">更换地址</button>
      </div>
    </section>

    <article class="markdown-body" id="doc" hidden></article>
  </main>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
    <div class="lightbox-bar">
      <div class="lightbox-meta">
        <span class="lightbox-alt" id="lightbox-alt"></span>
        <span class="lightbox-dim" id="lightbox-dim"></span>
      </div>
      <div class="lightbox-actions">
        <a class="lightbox-btn" id="lightbox-open" href="#" target="_blank" rel="noreferrer" title="在新标签页打开原图" aria-label="在新标签页打开原图">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
        </a>
        <button class="lightbox-btn" id="lightbox-close" type="button" title="关闭预览（Esc）" aria-label="关闭预览">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="lightbox-stage" id="lightbox-stage">
      <div class="lightbox-loading" id="lightbox-loading">正在加载图片…</div>
      <img class="lightbox-image" id="lightbox-image" alt="" draggable="false" referrerpolicy="no-referrer" hidden>
    </div>

    <div class="lightbox-tools" id="lightbox-tools">
      <button type="button" id="zoom-out" title="缩小（-）" aria-label="缩小">−</button>
      <button type="button" id="zoom-reset" title="适应窗口（0）" aria-label="适应窗口"><span id="zoom-label">100%</span></button>
      <button type="button" id="zoom-in" title="放大（+）" aria-label="放大">+</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
